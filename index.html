<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 브라우저 캐시 방지 (항상 최신 깃허브 페이지 불러오기) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>일본 프로야구(NPB) 실시간 대시보드</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0e1117;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        }

        /* 로딩 스피너 오버레이 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .icon-bounce {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: bounce 1.8s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .loader-desc {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* 깃허브 전체화면 래퍼 (하단 워터마크까지 가려서 완전한 순수 웹사이트로 표시) */
        .app-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #0e1117;
        }

        #app-frame {
            width: 100%;
            height: calc(100% + 45px); /* 하단 스트림릿 워터마크 바(45px)를 화면 밖으로 밀어냄 */
            border: none;
            display: block;
            background-color: #0e1117;
        }
    </style>
</head>
<body>

    <!-- 인트로 로딩 화면 -->
    <div id="loader">
        <div class="icon-bounce">⚾</div>
        <div class="spinner"></div>
        <div class="loader-title">일본 프로야구 대시보드</div>
        <div class="loader-desc">경기 데이터 및 포스트시즌 일정을 불러오는 중...</div>
    </div>

    <!-- 깃허브 페이지 안에서 100% 작동하는 전체화면 프레임 -->
    <div class="app-wrapper">
        <iframe 
            id="app-frame" 
            src="https://npbdashboard-fhd9vnhhv3jcwhcntewq2z.streamlit.app/?embed=true&embed_options=show_colored_line,light_theme" 
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const frame = document.getElementById('app-frame');
        const loader = document.getElementById('loader');

        frame.addEventListener('load', function() {
            setTimeout(function() {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 500);
        });

        // 3초 후 강제 페이드아웃 (화면 즉시 노출)
        setTimeout(function() {
            if (loader.style.visibility !== 'hidden') {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }, 3000);
    </script>
</body>
</html>
