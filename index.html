<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일본 프로야구(NPB) 실시간 대시보드</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0e1117;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        }

        /* 로딩 스피너 컨테이너 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .icon-bounce {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: bounce 1.8s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .loader-desc {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* 전체 화면 대시보드 프레임 */
        #app-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
            display: block;
            background-color: #0e1117;
        }
    </style>
</head>
<body>

    <!-- 부드러운 시작 로딩 화면 -->
    <div id="loader">
        <div class="icon-bounce">⚾</div>
        <div class="spinner"></div>
        <div class="loader-title">일본 프로야구 대시보드</div>
        <div class="loader-desc">경기 데이터 및 포스트시즌 일정을 불러오는 중...</div>
    </div>

    <!-- 깃허브 주소를 그대로 유지하며 전체 화면으로 실행되는 대시보드 프레임 -->
    <iframe 
        id="app-frame" 
        src="https://npbdashboard-fhd9vnhhv3jcwhcntewq2z.streamlit.app/?embed=true" 
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

    <script>
        const frame = document.getElementById('app-frame');
        const loader = document.getElementById('loader');

        // 프레임 로딩이 완료되면 로딩 화면을 부드럽게 페이드아웃
        frame.addEventListener('load', function() {
            setTimeout(function() {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 300);
        });

        // 만약 네트워크가 느려도 최대 3.5초 후에는 로딩 화면 숨김
        setTimeout(function() {
            if (loader.style.visibility !== 'hidden') {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
        }, 3500);
    </script>
</body>
</html>
