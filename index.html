<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본 프로야구(NPB) 실시간 대시보드</title>
    <!-- 자동 이동 (1초 후 배포된 Streamlit 앱으로 자동 전환) -->
    <meta http-equiv="refresh" content="1; url=https://npbdashboard-fhd9vnhhv3jcwhcntewq2z.streamlit.app/">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(245, 158, 11, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .icon-bounce {
            font-size: 3.5rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.3;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .feature-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-launch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
            transition: all 0.3s ease;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.5);
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
        }

        .footer-note {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="icon-bounce">⚾</div>
        <div class="badge">NPB Live Dashboard</div>
        <h1>일본 프로야구 대시보드</h1>
        <p>실시간 경기 중계, 리그 순위표, 타자/투수 기록 및<br><strong>클라이맥스 시리즈 & 일본시리즈</strong> 대진표를 제공합니다.</p>

        <div class="features">
            <span class="feature-tag">🔥 실시간 스코어</span>
            <span class="feature-tag">🍁 CS & 일본시리즈</span>
            <span class="feature-tag">🏟️ 구장 측량 지도</span>
            <span class="feature-tag">🏆 리그 순위표</span>
        </div>

        <div class="spinner"></div>
        <div style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 20px;">
            공식 대시보드 서버로 자동 연결 중입니다...
        </div>

        <a href="https://npbdashboard-fhd9vnhhv3jcwhcntewq2z.streamlit.app/" class="btn-launch" id="launchBtn">
            대시보드 바로 접속하기 ↗
        </a>

        <div class="footer-note">
            페이지가 자동으로 이동하지 않으면 위 버튼을 직접 클릭해 주세요.
        </div>
    </div>

    <script>
        // 0.8초 후 배포된 Streamlit 앱으로 자동 리다이렉트
        setTimeout(function() {
            window.location.replace("https://npbdashboard-fhd9vnhhv3jcwhcntewq2z.streamlit.app/");
        }, 800);
    </script>
</body>
</html>
